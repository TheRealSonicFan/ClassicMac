<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassicMac</title><link rel="stylesheet" href="platinum.css"></head>
<body>
  <nav><strong>ClassicMac</strong><button id="new">New Mac…</button><button id="open">Open Mac…</button><button id="library">Mac OS Library…</button><button id="about">About ClassicMac</button><span class="platform">Windows / Linux edition</span></nav>
  <main class="window"><header class="titlebar"><span></span><strong>ClassicMac</strong><span></span></header>
    <div class="workspace"><aside><h2>Macs on this computer:</h2><div id="machines" role="listbox" aria-label="Macs on this computer"></div><p class="hint">Open a .classic machine folder copied from your Mac, or create a new Mac with your own installation disc.</p></aside>
    <section class="home"><div id="display" tabindex="0" aria-label="Mac screen"><div id="curtain"><img src="powermac_g4-32.png" width="64" height="64" alt=""><p>Welcome to ClassicMac</p></div></div>
      <div class="heading"><h1 id="name">Your classic Macs, on your PC.</h1><span id="status">Ready</span></div>
      <fieldset><legend>About This Mac</legend><dl id="details"></dl><div class="info-buttons"><button id="settings">Get Info…</button><button id="disc">Media…</button><button id="reveal">Show in Explorer</button></div></fieldset>
      <footer><button id="pause">Pause</button><button id="restart">Restart</button><button id="stop">Shut Down…</button><button id="force">Force Off…</button><span class="spacer"></span><button id="fullscreen">Full Screen</button><button id="start" class="default">Start Mac</button></footer>
    </section></div>
  </main>
  <p id="notice" role="status">Choose a Mac to begin.</p>
  <dialog id="editor"><form method="dialog"><header class="titlebar"><strong id="editor-title">Get Info</strong></header><div class="dialog-body"><label>Name <input name="name" maxlength="100" required></label><label class="create-only">Model <select name="machineFamily"><option value="powerMacG4">Power Mac G4</option><option value="quadra800">Quadra 800</option></select></label><label class="create-only">Hard disk <select name="diskSizeGB"><option>2</option><option>8</option><option selected>32</option><option>64</option><option>120</option></select> GB</label><div class="edit-only"><label>Memory <input name="ramMB" type="number" min="16" max="1000"> MB</label><label>Screen <select name="resolution"><option>640x480</option><option>800x600</option><option selected>1024x768</option><option>1280x960</option><option>1600x1200</option><option>1920x1080</option></select></label><label>Colors <select name="depth"><option value="8">256</option><option value="16">Thousands</option><option value="32">Millions</option></select></label><label>Graphics <select name="graphicsCard"><option value="standard">Standard</option><option value="atiRadeon">ATI Radeon (3D acceleration)</option></select></label><label><input name="sound" type="checkbox"> Sound</label><label><input name="networking" type="checkbox"> Networking</label><label><input name="tabletInput" type="checkbox"> Tablet pointer</label><label><input name="classicInputHelpers" type="checkbox"> Right click as Control-click; scroll as arrow keys</label><label><input name="bootFromCD" type="checkbox"> Start from inserted CD</label><label><input name="disableSharing" type="checkbox"> Turn off host folder sharing for Windows</label><label><input name="ejectCD" type="checkbox"> Eject CD image</label></div></div><footer><button value="cancel" formnovalidate>Cancel</button><button id="save" value="save" class="default">Save</button></footer></form></dialog>
  <dialog id="message"><header class="titlebar"><strong>ClassicMac</strong></header><div class="dialog-body"><p id="message-text"></p></div><footer><button id="message-ok" class="default">OK</button></footer></dialog>
  <script type="module" src="renderer.js"></script>
</body></html>
