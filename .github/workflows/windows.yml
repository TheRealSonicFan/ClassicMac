name: Windows desktop
on:
  push:
    branches: [codex/windows-app]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make diffutils mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-distlib mingw-w64-ucrt-x86_64-python-packaging
            mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libslirp mingw-w64-ucrt-x86_64-dtc
            mingw-w64-ucrt-x86_64-zstd
      - name: Build patched Windows engines
        shell: msys2 {0}
        run: |
          windows/scripts/build-engine.sh
          python3 ati/tests/test_qemu_ati.py --gl-optional output/windows/runtime/bin/qemu-system-ppc.exe output/windows/runtime/qemu/pc-bios
          tar --exclude=.git --exclude=build --exclude=build-windows -czf output/windows/ClassicMac-Windows-QEMU-source.tar.gz -C vendor qemu
      - name: Include the qualified Tools CD
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v4.0.0-preview.3 --repo amcchord/ClassicMac --pattern 'ClassicMac-4.0.0-Preview-3.zip' --dir output/windows/tools
          $archive = 'output/windows/tools/ClassicMac-4.0.0-Preview-3.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne '3552de300fdb809dd974f696b6e82e7b0248f94086770f46b66650477c2e8ba6') { throw 'Tools source archive checksum mismatch' }
          Expand-Archive $archive output/windows/tools/extracted
          Copy-Item 'output/windows/tools/extracted/ClassicMac.app/Contents/Resources/ClassicMacTools.iso' 'output/windows/runtime/ClassicMacTools.iso'
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicMac-Windows-runtime
          path: output/windows/runtime
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicMac-Windows-QEMU-source
          path: output/windows/ClassicMac-Windows-QEMU-source.tar.gz
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Build Windows desktop package
        working-directory: windows
        run: |
          npm ci
          npm test
          npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: ClassicMac-Windows-app
          path: output/windows/packages/*.zip
          retention-days: 14
